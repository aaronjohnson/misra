[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misra"
version = "0.3.0"
description = "Cross-checks a laptop's sensors with logic rules (clingo)"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["clingo", "pillow"]

[project.scripts]
misra = "misra.__main__:main"

[tool.setuptools]
packages = ["misra", "misra.collect"]

[tool.setuptools.package-data]
misra = ["rules/*.lp", "rules/*/*.lp"]
